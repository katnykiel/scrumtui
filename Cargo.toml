[package]
name = "scrumtui"
version = "2.4.1"
edition = "2021"

[[bin]]
name = "scrumtui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
csv = "1"
signal-hook = "0.4.4"

# Clipboard for `y` when no clipboard tool (wl-copy, xclip, xsel) is installed
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false }
